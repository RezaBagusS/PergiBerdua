services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pergiberdua
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pergiberdua
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pergiberdua -d pergiberdua"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
  web:
    build: ./web
    environment:
      DATABASE_URL: postgres://pergiberdua:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/pergiberdua
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      ADMIN_SECRET: ${ADMIN_SECRET:-admin12345}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-PergiBerdua <hello@pergiberdua.local>}
      APP_MODE: ${APP_MODE:-development}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 35s
      retries: 5
    restart: unless-stopped
volumes:
  postgres-data:
