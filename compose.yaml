services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pergiberdua
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pergiberdua
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pergiberdua -d pergiberdua"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
  api:
    build: ./api
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: pergiberdua
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: pergiberdua
    # Internal only. Browser traffic reaches API via Next's /api route handler.
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  web:
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:3000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 35s
      retries: 5
    restart: unless-stopped
volumes:
  postgres-data:
